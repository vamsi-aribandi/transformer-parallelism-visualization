[project]
name = "tpviz"
version = "0.1.0"
description = "Animated visualizations of transformer parallelism (DP, FSDP, TP, CP, PP, EP) in JAX scaling-book notation, built with Manim CE"
requires-python = ">=3.12"
dependencies = [
    "manim>=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
