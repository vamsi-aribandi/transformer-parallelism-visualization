<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributed Transformer Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root {
  --bg: #0e1116;
  --surface: #151b24;
  --surface-2: #1a2029;
  --border: #2a3342;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --accent: #f59e0b;
  --act: #f59e0b;
  --wt: #3b82f6;
  --kv: #14b8a6;
  --grad: #f43f5e;
  --grad-soft: #fda4af;
  --comm: #f87171;
  --good: #4ade80;
  --font: "Inter", -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
}

#app {
  height: 100vh;
  display: grid;
  grid-template:
    "top top" 54px
    "panel stage" 1fr
    "panel transport" 62px
    / 360px 1fr;
}

/* ------------------------------------------------------------- top bar */
#topbar {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
#brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark { color: var(--accent); font-size: 19px; }
.brand-name { font-weight: 600; font-size: 14px; letter-spacing: 0.01em; white-space: nowrap; }

#tabs { display: flex; gap: 2px; margin-left: 8px; }
#tabs button {
  background: none; border: none; color: var(--muted);
  font: 500 13px var(--font); padding: 7px 12px; cursor: pointer;
  border-radius: 7px; position: relative;
}
#tabs button:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
#tabs button.active { color: var(--accent); }
#tabs button.active::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: 1px;
  height: 2px; border-radius: 1px; background: var(--accent);
}
#tabs button:disabled { opacity: 0.32; cursor: default; }

#mode-toggle {
  display: flex; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 2px; gap: 2px;
}
#mode-toggle button {
  background: none; border: none; color: var(--muted);
  font: 500 12.5px var(--font); padding: 5px 12px; border-radius: 6px; cursor: pointer;
}
#mode-toggle button.active { background: var(--bg); color: var(--text); }
#mode-toggle button:disabled { opacity: 0.32; cursor: default; }

#status { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.eq-inline svg { height: 15px; color: var(--accent); display: block; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 11px; font-size: 12.5px;
}
.chip i { font-style: normal; color: var(--muted); font-size: 12px; }
.chip b { font-family: var(--mono); font-weight: 500; min-width: 2ch; text-align: right; }
#chip-coll b { color: var(--comm); }
#chip-mm b { color: var(--text); }
#legend-btn {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--muted); cursor: pointer; font-size: 12px;
}
#legend-btn:hover { color: var(--text); }

/* ------------------------------------------------------------- program */
#program {
  grid-area: panel;
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex; flex-direction: column;
  min-height: 0;
}
#program-head {
  padding: 12px 16px 10px;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); display: flex; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
#program-list { overflow-y: auto; padding: 6px 0 30px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

.prog-section { margin-top: 4px; }
.prog-section-head {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px 5px; cursor: pointer; user-select: none;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em;
  color: var(--muted);
}
.prog-section-head .chev { transition: transform 0.15s; font-size: 9px; }
.prog-section.open .chev { transform: rotate(90deg); }
.prog-section-head.fwd { color: var(--accent); }
.prog-section-head.bwd { color: var(--grad-soft); }
.prog-entries { display: none; }
.prog-section.open .prog-entries { display: block; }

.prog-entry {
  position: relative;
  padding: 6px 16px 6px 22px;
  cursor: pointer;
  border-left: 2px solid transparent;
  opacity: 0.85;
}
.prog-entry:hover { background: var(--surface-2); }
.prog-entry.done { opacity: 0.45; }
.prog-entry.current {
  opacity: 1;
  background: var(--surface-2);
  border-left-color: var(--accent);
}
.prog-entry.current.bwd { border-left-color: var(--grad); }
.prog-entry .eqline svg { max-width: 100%; height: auto; display: block; color: var(--text); }
.prog-entry.comm .eqline svg { color: var(--comm); }
.prog-entry.current .eqline svg { color: var(--text); }
.prog-entry.current.comm .eqline svg { color: var(--comm); }
.prog-entry .cap {
  margin-top: 3px; font-size: 11px; color: var(--muted); line-height: 1.35;
  display: none;
}
.prog-entry.current .cap { display: block; }
.prog-entry .note { margin-top: 3px; display: none; }
.prog-entry .note svg { height: 11px; color: var(--muted); }
.prog-entry.current .note, .prog-entry:hover .note { display: block; }
.prog-entry .savechip {
  font-size: 10px; color: var(--muted); letter-spacing: 0.08em;
  text-transform: uppercase; margin-right: 6px;
}

/* --------------------------------------------------------------- stage */
#stage { grid-area: stage; position: relative; display: flex; min-width: 0; min-height: 0; background: var(--bg); }
#canvas { width: 100%; height: 100%; display: block; }
#canvas-bg { fill: var(--bg); }
#canvas text { font-family: var(--font); }
.hit { cursor: default; }
.hit:hover { filter: brightness(1.18); }

#tooltip {
  position: absolute; z-index: 30; pointer-events: none;
  background: rgba(16, 20, 28, 0.97);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 13px; max-width: 320px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
  font-size: 12px; line-height: 1.5;
}
#tooltip .tt-eq { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
#tooltip .tt-eq svg { height: 15px; color: var(--text); }
#tooltip .kindchip {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor;
}
#tooltip table { border-collapse: collapse; }
#tooltip td { padding: 1px 0; }
#tooltip td:first-child { color: var(--muted); padding-right: 12px; }
#tooltip td.num { font-family: var(--mono); font-size: 11.5px; }
#tooltip .shard-desc { margin-top: 5px; color: var(--muted); font-size: 11.5px; }
#tooltip .partial-warn { margin-top: 5px; color: var(--comm); font-size: 11.5px; }

#legend[hidden], #tooltip[hidden], #scrub-label[hidden] { display: none; }
#legend {
  position: absolute; top: 10px; right: 12px; z-index: 25;
  background: rgba(16, 20, 28, 0.97); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 15px; font-size: 12px;
  display: flex; flex-direction: column; gap: 7px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
}
.lg-row { display: flex; align-items: center; gap: 9px; color: var(--muted); }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.sw-dash { background: none; border: 1.5px dashed var(--muted); }
.sw-dim { background: var(--act); opacity: 0.4; }

/* ----------------------------------------------------------- transport */
#transport {
  grid-area: transport;
  display: flex; align-items: center; gap: 12px;
  padding: 0 18px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
#transport button {
  background: none; border: none; color: var(--text);
  font-size: 15px; cursor: pointer; padding: 6px 8px; border-radius: 7px;
}
#transport button:hover { background: var(--surface-2); }
#btn-play { font-size: 17px; width: 38px; }
#speed {
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  border-radius: 7px; font: 500 12px var(--font); padding: 4px 6px;
}
#clock { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 92px; text-align: center; }

#slider-wrap { position: relative; flex: 1; height: 26px; display: flex; align-items: center; }
#slider-regions {
  position: absolute; left: 0; right: 0; height: 5px; border-radius: 3px;
  top: 50%; transform: translateY(-50%);
  background: var(--surface-2); overflow: hidden; pointer-events: none;
}
#slider-regions .region { position: absolute; top: 0; bottom: 0; }
#slider-ticks { position: absolute; left: 0; right: 0; top: 3px; bottom: 3px; pointer-events: none; }
#slider-ticks .tick { position: absolute; top: 25%; bottom: 25%; width: 1px; background: rgba(229, 231, 235, 0.25); }
#slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; background: transparent; position: relative; z-index: 2;
  height: 26px; cursor: pointer;
}
#slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--text); border: 2.5px solid var(--bg);
  box-shadow: 0 0 0 1.5px var(--accent), 0 1px 5px rgba(0,0,0,.6);
  margin-top: 0;
}
#slider::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--text); border: 2.5px solid var(--bg);
  box-shadow: 0 0 0 1.5px var(--accent);
}
#scrub-label {
  position: absolute; bottom: 26px; transform: translateX(-50%);
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 9px; font-size: 11px; white-space: nowrap;
  pointer-events: none; z-index: 5;
}

/* --------------------------------------------------------- responsive */
@media (max-width: 1180px) {
  #app { grid-template: "top" 54px "stage" 1fr "transport" 62px / 1fr; }
  #program { display: none; }
  .brand-name { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">
      <span class="brand-mark">⊞</span>
      <span class="brand-name">Distributed Transformer Training</span>
    </div>
    <nav id="tabs" aria-label="strategy"></nav>
    <div id="mode-toggle" role="tablist" aria-label="pass">
      <button data-mode="fwd" role="tab">Forward</button>
      <button data-mode="train" role="tab">Training</button>
    </div>
    <div id="status">
      <span id="mesh-eq" class="eq-inline"></span>
      <span class="chip" id="chip-coll" title="collectives so far"><i>⇄</i><b>0</b></span>
      <span class="chip" id="chip-mm" title="matmuls so far"><i>×</i><b>0</b></span>
      <button id="legend-btn" title="legend">?</button>
    </div>
  </header>

  <aside id="program">
    <div id="program-head">
      <span>Program</span>
      <span id="program-sub"></span>
    </div>
    <div id="program-list"></div>
  </aside>

  <main id="stage">
    <svg id="canvas" viewBox="0 110 1422 690" preserveAspectRatio="xMidYMid meet">
      <defs id="glyph-defs"></defs>
      <rect id="canvas-bg" x="0" y="110" width="1422" height="690"></rect>
      <g id="scene"></g>
    </svg>
    <div id="tooltip" hidden></div>
    <div id="legend" hidden>
      <div class="lg-row"><span class="sw" style="background:var(--act)"></span> activations</div>
      <div class="lg-row"><span class="sw" style="background:var(--wt)"></span> weights</div>
      <div class="lg-row"><span class="sw" style="background:var(--kv)"></span> K / V</div>
      <div class="lg-row"><span class="sw" style="background:var(--grad)"></span> gradients</div>
      <div class="lg-row"><span class="sw sw-dash"></span> ghost = full logical extent · dashed fill = unreduced partial</div>
      <div class="lg-row"><span class="sw sw-dim"></span> dimmed mini = saved activation (memory for backward)</div>
    </div>
  </main>

  <footer id="transport">
    <button id="btn-prev" title="previous step (←)">⏮</button>
    <button id="btn-play" title="play / pause (space)">▶</button>
    <button id="btn-next" title="next step (→)">⏭</button>
    <select id="speed" title="speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
    <span id="clock">0:00 / 0:00</span>
    <div id="slider-wrap">
      <div id="slider-regions"></div>
      <div id="slider-ticks"></div>
      <input id="slider" type="range" min="0" max="1000" value="0" step="1">
      <div id="scrub-label" hidden></div>
    </div>
  </footer>
</div>

<script>"use strict";
/* Parse the embedded document and build fast runtime indexes. */

const DOC = JSON.parse(document.getElementById("tpviz-data").textContent);
const FRAME_W = DOC.frame[0], FRAME_H = DOC.frame[1];
const PAL = DOC.palette;

/* manim scene coords (centi-units, y-up, origin center) -> svg */
const SX = (v) => v + FRAME_W / 2;
const SY = (v) => FRAME_H / 2 - v;

function axisCoord(mesh, axis, device) {
  let rem = device;
  const names = Object.keys(mesh).reverse();
  for (const name of names) {
    const size = mesh[name];
    const coord = rem % size;
    if (name === axis) return coord;
    rem = Math.floor(rem / size);
  }
  return 0;
}

function shardFrac(tensor, dim) {
  const ax = tensor.shard[dim];
  if (!ax || !tensor.sharded) return [1, 0];
  const n = tensor.mesh[ax] || 1;
  return [1 / n, axisCoord(tensor.mesh, ax, tensor.device) / n];
}

/* Build a runtime timeline: per-object track lists sorted by t0. */
function buildTimeline(name) {
  const tl = DOC.timelines[name];
  const objs = tl.objects.map((spec) => ({
    spec,
    el: null,
    tracks: { x: [], y: [], w: [], o: [] },
  }));
  for (const row of tl.tracks) {
    const [idx, prop, t0, t1, vals] = row;
    objs[idx].tracks[prop].push({ t0, t1, vals });
  }
  return { name, tl, objs };
}

function fmtClock(cs) {
  const s = Math.max(0, Math.round(cs / 100));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

"use strict";
/* SVG builders. Decks and weight rects are redrawn from tensor metadata with
   the same geometry as src/tpviz/mobjects/tensor_mobject.py (centi-units). */

const NS = "http://www.w3.org/2000/svg";
const DIM_LEN = { D: 150, F: 230, H: 120, T: 100, S: 90, B: 100, E: 100 };
const N_SLABS = 4, SLAB_DX = 9, SLAB_DY = 7;

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}

function installGlyphs() {
  const defs = document.getElementById("glyph-defs");
  for (const gid in DOC.glyphs) {
    svgEl("path", { id: gid, d: DOC.glyphs[gid], fill: "currentColor" }, defs);
  }
}

/* Equation group in pt-space scaled to `heightPx`, centered at origin unless
   anchor === "nw" (top-left at origin). Returns the <g>. */
function eqGroup(eqKey, heightPx, anchor = "c") {
  const eq = DOC.eq[eqKey];
  const g = document.createElementNS(NS, "g");
  const s = heightPx / eq.h;
  const ox = anchor === "c" ? -eq.w * s / 2 : 0;
  const oy = anchor === "c" ? -eq.h * s / 2 : 0;
  g.setAttribute("transform", `translate(${ox},${oy}) scale(${s})`);
  for (const [gid, x, y] of eq.u) {
    svgEl("use", { href: `#${gid}`, x, y }, g);
  }
  for (const [x, y, w, h] of eq.r || []) {
    svgEl("rect", { x, y, width: w, height: h, fill: "currentColor" }, g);
  }
  return g;
}

/* Standalone inline <svg> for an equation (program panel, tooltips, chips). */
function eqSvg(eqKey, heightPx) {
  const eq = DOC.eq[eqKey];
  const s = heightPx / eq.h;
  const svg = svgEl("svg", {
    viewBox: `0 0 ${eq.w} ${eq.h}`,
    width: (eq.w * s).toFixed(1),
    height: heightPx,
  });
  const g = svgEl("g", {}, svg);
  for (const [gid, x, y] of eq.u) svgEl("use", { href: `#${gid}`, x, y, fill: "currentColor" }, g);
  for (const [x, y, w, h] of eq.r || []) svgEl("rect", { x, y, width: w, height: h, fill: "currentColor" }, g);
  return svg;
}

function ghostRect(g, w, h, cx, cy) {
  svgEl("rect", {
    x: cx - w / 2, y: cy - h / 2, width: w, height: h,
    fill: "none", stroke: PAL.muted, "stroke-opacity": 0.45,
    "stroke-width": 1.4, "stroke-dasharray": "6 5",
  }, g);
}

/* ------------------------------------------------------------------ deck */
function drawDeck(spec) {
  const t = spec.tensor;
  const g = document.createElementNS(NS, "g");
  const widthDim = t.dims[t.dims.length - 1];
  const fullW = DIM_LEN[widthDim] || 150, fullH = DIM_LEN.T;
  const hasB = t.dims.includes("B"), hasT = t.dims.includes("T");
  const [fb, ob] = hasB ? shardFrac(t, "B") : [1, 0];
  const [ft, ot] = hasT ? shardFrac(t, "T") : [1, 0];
  const [fw, ow] = shardFrac(t, widthDim);
  const fill = PAL.fill[t.kind], stroke = PAL.stroke[t.kind];
  const partial = t.partial && t.partial.length;
  const opacity = partial ? 0.3 : 0.85;

  let own, total;
  if (hasB) {
    const nOwn = Math.max(1, Math.round(N_SLABS * fb));
    const start = Math.min(Math.round(N_SLABS * ob), N_SLABS - nOwn);
    own = new Set(Array.from({ length: nOwn }, (_, i) => start + i));
    total = fb < 1 ? N_SLABS : Math.max(...own) + 1;
  } else { own = new Set([0]); total = 1; }
  const frontOwn = Math.min(...own);

  const solidW = fullW * fw, solidH = fullH * ft;
  for (let i = total - 1; i >= 0; i--) {
    const dx = i * SLAB_DX, dy = -i * SLAB_DY; // y-down svg: manim up-shift = -y
    if (!own.has(i)) { ghostRect(g, fullW, fullH, dx, dy); continue; }
    const fade = i !== frontOwn ? 0.55 : 1;
    // shard offset inside the full extent (top-left anchored)
    const sx = dx - fullW / 2 + fullW * ow + solidW / 2;
    const sy = dy - fullH / 2 + fullH * ot + solidH / 2;
    if ((ft < 1 || fw < 1) && i === frontOwn) ghostRect(g, fullW, fullH, dx, dy);
    const attrs = {
      x: sx - solidW / 2, y: sy - solidH / 2, width: solidW, height: solidH,
      fill, "fill-opacity": opacity * fade,
      stroke, "stroke-opacity": partial ? 0 : fade, "stroke-width": 1.6,
    };
    svgEl("rect", attrs, g);
    if (partial) {
      svgEl("rect", {
        x: sx - solidW / 2, y: sy - solidH / 2, width: solidW, height: solidH,
        fill: "none", stroke, "stroke-opacity": fade, "stroke-width": 1.6,
        "stroke-dasharray": "7 5",
      }, g);
    }
  }
  return fitToSpec(g, spec);
}

/* ----------------------------------------------------------- weight rect */
function drawWeightRect(spec) {
  const t = spec.tensor;
  const g = document.createElementNS(NS, "g");
  const d0 = t.dims[t.dims.length - 2], d1 = t.dims[t.dims.length - 1];
  const fullH = (DIM_LEN[d0] || 100) * 0.75, fullW = (DIM_LEN[d1] || 100) * 0.75;
  const [f0, o0] = shardFrac(t, d0);
  const [f1, o1] = shardFrac(t, d1);
  const fill = PAL.fill[t.kind] || PAL.fill.weight;
  const stroke = PAL.stroke[t.kind] || PAL.stroke.weight;
  const partial = t.partial && t.partial.length;
  const solidW = fullW * f1, solidH = fullH * f0;
  let sx = 0, sy = 0;
  if (f0 < 1 || f1 < 1) {
    ghostRect(g, fullW, fullH, 0, 0);
    sx = -fullW / 2 + fullW * o1 + solidW / 2;
    sy = -fullH / 2 + fullH * o0 + solidH / 2;
  }
  svgEl("rect", {
    x: sx - solidW / 2, y: sy - solidH / 2, width: solidW, height: solidH,
    fill, "fill-opacity": partial ? 0.3 : 0.85, stroke, "stroke-width": 1.8,
    ...(partial ? { "stroke-dasharray": "6 4" } : {}),
  }, g);
  // hatch texture
  const step = 18;
  for (let cx = -solidW / 2 + step; cx < solidW / 2 + solidH; cx += step) {
    const x1 = Math.max(-solidW / 2, cx - solidH), y1 = Math.min(solidH / 2, -solidH / 2 + (cx - x1));
    const x2 = Math.min(solidW / 2, cx), y2 = -solidH / 2 + (cx - x2);
    if (x1 < x2) svgEl("line", {
      x1: sx + x1, y1: sy + y1, x2: sx + x2, y2: sy + y2,
      stroke, "stroke-opacity": 0.25, "stroke-width": 0.8,
    }, g);
  }
  return fitToSpec(g, spec);
}

/* Scale a natural-size group so its bbox matches the recorded spawn size. */
function fitToSpec(g, spec) {
  const wrap = document.createElementNS(NS, "g");
  wrap.appendChild(g);
  // natural bbox is computed after insertion; do it lazily on first layout
  wrap.dataset.fitW = spec.w;
  wrap.dataset.fitH = spec.h;
  return wrap;
}

function applyFit(wrap) {
  const inner = wrap.firstChild;
  const bb = inner.getBBox();
  if (bb.width < 1e-3) return;
  const s = Math.min(+wrap.dataset.fitW / bb.width, +wrap.dataset.fitH / bb.height);
  const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
  inner.setAttribute("transform", `scale(${s.toFixed(5)}) translate(${(-cx).toFixed(2)},${(-cy).toFixed(2)})`);
}

/* ------------------------------------------------------------ primitives */
function drawObject(spec) {
  switch (spec.c) {
    case "deck": return drawDeck(spec);
    case "wrect": return drawWeightRect(spec);
    case "eq": {
      const g = document.createElementNS(NS, "g");
      g.appendChild(eqGroup(spec.eq, spec.h));
      g.style.color = spec.color || PAL.text;
      return g;
    }
    case "text": {
      const g = document.createElementNS(NS, "g");
      const el = svgEl("text", {
        "text-anchor": "middle", "dominant-baseline": "central",
        "font-size": (spec.h * 1.05).toFixed(1),
        fill: spec.color || PAL.text,
        "font-weight": spec.bold ? 700 : 500,
      }, g);
      el.textContent = spec.s;
      return g;
    }
    case "rect": {
      const g = document.createElementNS(NS, "g");
      svgEl("rect", {
        x: -spec.w / 2, y: -spec.h / 2, width: spec.w, height: spec.h,
        rx: (spec.r || 0) * 100,
        fill: spec.fill, "fill-opacity": spec.fo,
        stroke: spec.stroke, "stroke-opacity": spec.so, "stroke-width": spec.sw,
      }, g);
      return g;
    }
    case "dashrect": {
      const g = document.createElementNS(NS, "g");
      svgEl("rect", {
        x: -spec.w / 2, y: -spec.h / 2, width: spec.w, height: spec.h,
        fill: "none", stroke: spec.stroke, "stroke-width": spec.sw,
        "stroke-dasharray": "7 5",
      }, g);
      return g;
    }
    case "token": case "dot": {
      const g = document.createElementNS(NS, "g");
      if (spec.c === "dot") svgEl("circle", { r: spec.w / 2, fill: spec.fill }, g);
      else svgEl("rect", {
        x: -spec.w / 2, y: -spec.h / 2, width: spec.w, height: spec.h,
        fill: spec.fill, "fill-opacity": spec.fo,
        stroke: spec.stroke, "stroke-width": spec.sw,
      }, g);
      return g;
    }
    case "line": {
      const g = document.createElementNS(NS, "g");
      svgEl("line", {
        x1: -spec.dx * 100 / 2, y1: spec.dy * 100 / 2,
        x2: spec.dx * 100 / 2, y2: -spec.dy * 100 / 2,
        stroke: spec.stroke, "stroke-width": spec.sw,
        ...(spec.dashed ? { "stroke-dasharray": "5 5" } : {}),
      }, g);
      return g;
    }
    case "arc": {
      const g = document.createElementNS(NS, "g");
      svgEl("circle", {
        r: spec.w / 2, fill: "none", stroke: spec.stroke, "stroke-width": spec.sw,
        "stroke-dasharray": "4 4",
      }, g);
      return g;
    }
    default: return document.createElementNS(NS, "g");
  }
}

"use strict";
/* The dumb player: binary-search each object's keyframe segments at time t,
   set transform/opacity. No semantic logic lives here. */

class Player {
  constructor(sceneEl) {
    this.sceneEl = sceneEl;
    this.rt = null;
    this.t = 0;
    this.playing = false;
    this.speed = 1;
    this._raf = null;
    this._last = 0;
    this.onTick = () => {};
  }

  load(rt) {
    this.rt = rt;
    this.sceneEl.textContent = "";
    const layers = new Map();
    const order = rt.objs
      .map((o, i) => ({ o, i }))
      .sort((a, b) => (a.o.spec.z - b.o.spec.z) || (a.i - b.i));
    for (const { o } of order) {
      const el = drawObject(o.spec);
      el.classList.add("obj");
      if (o.spec.tip !== undefined) {
        el.classList.add("hit");
        el.dataset.tip = o.spec.tip;
        el.dataset.tex = o.spec.tex;
      }
      o.el = el;
      this.sceneEl.appendChild(el);
    }
    // deck/wrect groups need bbox-based fitting after DOM insertion
    for (const o of this.rt.objs) {
      if (o.el.dataset.fitW) applyFit(o.el);
    }
    this.t = 0;
    this.seek(0);
  }

  static sample(track, t, fallback) {
    // track: sorted [{t0,t1,vals[5]}]; returns value at t or fallback
    let lo = 0, hi = track.length - 1, best = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (track[mid].t0 <= t) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0) return fallback;
    const seg = track[best];
    const vals = seg.vals;
    if (t >= seg.t1) return vals[vals.length - 1];
    const u = ((t - seg.t0) / (seg.t1 - seg.t0)) * (vals.length - 1);
    const i = Math.min(Math.floor(u), vals.length - 2);
    return vals[i] + (vals[i + 1] - vals[i]) * (u - i);
  }

  seek(t) {
    const rt = this.rt;
    if (!rt) return;
    this.t = Math.max(0, Math.min(t, rt.tl.dur));
    for (const o of rt.objs) {
      const s = o.spec;
      const alive = this.t >= s.t0 && (this.t < s.t1 || s.t1 >= rt.tl.dur);
      if (!alive) { if (o.el.style.display !== "none") o.el.style.display = "none"; continue; }
      if (o.el.style.display === "none") o.el.style.display = "";
      const x = Player.sample(o.tracks.x, this.t, s.x);
      const y = Player.sample(o.tracks.y, this.t, s.y);
      const w = Player.sample(o.tracks.w, this.t, 100) / 100;
      const op = Player.sample(o.tracks.o, this.t, s.o) / 100;
      o.el.setAttribute(
        "transform",
        `translate(${SX(x).toFixed(1)},${SY(y).toFixed(1)})${w !== 1 ? ` scale(${w.toFixed(4)})` : ""}`
      );
      o.el.setAttribute("opacity", op.toFixed(3));
    }
    this.onTick(this.t);
  }

  play() {
    if (this.playing) return;
    this.playing = true;
    this._last = performance.now();
    const loop = (now) => {
      if (!this.playing) return;
      const dt = ((now - this._last) / 1000) * 100 * this.speed; // cs
      this._last = now;
      let t = this.t + dt;
      if (t >= this.rt.tl.dur) { t = this.rt.tl.dur; this.pause(); }
      this.seek(t);
      if (this.playing) this._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  pause() {
    this.playing = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    this.onTick(this.t);
  }

  toggle() { this.playing ? this.pause() : this.play(); }
}

"use strict";
/* The program panel: the pass as a listing, grouped by (direction, layer,
   phase), live-highlighted, click-to-seek. */

const PHASE_TITLE = { attn: "Attention", mlp: "MLP", moe: "MoE MLP", pipeline: "Pipeline", "": "" };

class Program {
  constructor(listEl, onSeek) {
    this.listEl = listEl;
    this.onSeek = onSeek;
    this.entries = [];
    this.current = -1;
    this._noScrollUntil = 0;
    listEl.addEventListener("scroll", () => { this._noScrollUntil = performance.now() + 3000; }, { passive: true });
  }

  build(tl) {
    this.listEl.textContent = "";
    this.entries = [];
    this.current = -1;
    let section = null, sectionKey = "";
    tl.steps.forEach((st, i) => {
      const key = `${st.bwd ? "b" : "f"}|${st.layer}|${st.phase}`;
      if (key !== sectionKey) {
        sectionKey = key;
        section = document.createElement("div");
        section.className = "prog-section open";
        const head = document.createElement("div");
        head.className = `prog-section-head ${st.bwd ? "bwd" : "fwd"}`;
        const title = st.phase === "pipeline"
          ? `${st.bwd ? "◀ Backward · " : ""}Pipeline`
          : `${st.bwd ? "◀ Backward · " : ""}Layer ${st.layer} · ${PHASE_TITLE[st.phase] || st.phase}`;
        head.innerHTML = `<span class="chev">▶</span><span>${title}</span>`;
        head.addEventListener("click", () => section.classList.toggle("open"));
        section.appendChild(head);
        const wrap = document.createElement("div");
        wrap.className = "prog-entries";
        section.appendChild(wrap);
        this.listEl.appendChild(section);
      }
      const entry = document.createElement("div");
      entry.className = "prog-entry" + (st.bwd ? " bwd" : "") + (st.kind !== "MatMul" && st.kind !== "Gelu" && st.kind !== "SplitQKV" && st.kind !== "MergeQKV" && st.kind !== "AttentionCore" && st.kind !== "AttentionBwd" && st.kind !== "SaveActivation" && st.kind !== "Route" ? " comm" : "");
      const eqline = document.createElement("div");
      eqline.className = "eqline";
      if (st.kind === "SaveActivation") {
        const chip = document.createElement("span");
        chip.className = "savechip";
        chip.textContent = "save";
        eqline.appendChild(chip);
      }
      if (st.eq) eqline.appendChild(eqSvg(st.eq, 13));
      else eqline.textContent = st.kind + (st.mb !== undefined ? ` · mb${st.mb}` : "");
      entry.appendChild(eqline);
      if (st.note) {
        const note = document.createElement("div");
        note.className = "note";
        note.appendChild(eqSvg(st.note, 10));
        entry.appendChild(note);
      }
      if (st.cap) {
        const cap = document.createElement("div");
        cap.className = "cap";
        cap.textContent = st.cap;
        entry.appendChild(cap);
      }
      entry.addEventListener("click", () => this.onSeek(st.t0 + 1));
      section.querySelector(".prog-entries").appendChild(entry);
      this.entries.push({ el: entry, st, section });
    });
  }

  update(t) {
    let cur = -1;
    for (let i = 0; i < this.entries.length; i++) {
      if (this.entries[i].st.t0 <= t) cur = i; else break;
    }
    if (cur === this.current) return;
    this.current = cur;
    this.entries.forEach((e, i) => {
      e.el.classList.toggle("current", i === cur);
      e.el.classList.toggle("done", i < cur);
    });
    if (cur >= 0) {
      const e = this.entries[cur];
      if (!e.section.classList.contains("open")) e.section.classList.add("open");
      if (performance.now() > this._noScrollUntil) {
        e.el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }
  }
}

"use strict";
/* Hover metadata for tensors: notation, shapes with concrete dims, sharding,
   memory. Attached by delegation on the canvas. */

const KIND_COLOR = { activation: "var(--act)", weight: "var(--wt)", kv: "var(--kv)", grad: "var(--grad)" };

function initTooltip(stageEl, canvasEl) {
  const tip = document.getElementById("tooltip");

  function show(target, ev) {
    const data = DOC.tooltips[+target.dataset.tip];
    if (!data) return;
    tip.textContent = "";
    const head = document.createElement("div");
    head.className = "tt-eq";
    if (target.dataset.tex) head.appendChild(eqSvg(target.dataset.tex, 15));
    const chip = document.createElement("span");
    chip.className = "kindchip";
    chip.style.color = KIND_COLOR[data.kind] || "var(--text)";
    chip.textContent = data.kind;
    head.appendChild(chip);
    tip.appendChild(head);

    const tbl = document.createElement("table");
    const rows = [
      ["global", `${data.global.join(" × ")}`, data.memGlobal],
      ["this device", `${data.local.join(" × ")}`, data.memLocal],
    ];
    for (const [k, shape, mem] of rows) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${k}</td><td class="num">${shape}</td><td class="num" style="padding-left:12px;color:var(--muted)">${mem}</td>`;
      tbl.appendChild(tr);
    }
    tip.appendChild(tbl);

    const sd = document.createElement("div");
    sd.className = "shard-desc";
    sd.textContent = data.shardDesc;
    tip.appendChild(sd);

    if (data.partial) {
      const pw = document.createElement("div");
      pw.className = "partial-warn";
      pw.textContent = `unreduced partial sum over ${data.partial.join(", ")} — not yet a real value`;
      tip.appendChild(pw);
    }
    tip.hidden = false;
    move(ev);
  }

  function move(ev) {
    const r = stageEl.getBoundingClientRect();
    let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > r.width - 8) x = ev.clientX - r.left - tw - 14;
    if (y + th > r.height - 8) y = ev.clientY - r.top - th - 14;
    tip.style.left = `${x}px`;
    tip.style.top = `${y}px`;
  }

  canvasEl.addEventListener("pointerover", (ev) => {
    const t = ev.target.closest(".hit");
    if (t) show(t, ev);
  });
  canvasEl.addEventListener("pointermove", (ev) => {
    if (!tip.hidden) move(ev);
  });
  canvasEl.addEventListener("pointerout", (ev) => {
    if (!ev.relatedTarget || !ev.relatedTarget.closest || !ev.relatedTarget.closest(".hit")) tip.hidden = true;
  });
}

"use strict";
/* Transport bar: slider with forward/backward regions and phase ticks,
   play/pause, step buttons, speed, keyboard, clock. */

class Transport {
  constructor(player) {
    this.player = player;
    this.slider = document.getElementById("slider");
    this.clock = document.getElementById("clock");
    this.playBtn = document.getElementById("btn-play");
    this.regions = document.getElementById("slider-regions");
    this.ticks = document.getElementById("slider-ticks");
    this.scrubLabel = document.getElementById("scrub-label");
    this.steps = [];

    this.slider.addEventListener("input", () => {
      player.pause();
      player.seek(+this.slider.value);
    });
    this.playBtn.addEventListener("click", () => player.toggle());
    document.getElementById("btn-prev").addEventListener("click", () => this.step(-1));
    document.getElementById("btn-next").addEventListener("click", () => this.step(1));
    document.getElementById("speed").addEventListener("change", (e) => {
      player.speed = +e.target.value;
    });
    this.slider.addEventListener("pointermove", (ev) => this.preview(ev));
    this.slider.addEventListener("pointerleave", () => { this.scrubLabel.hidden = true; });

    document.addEventListener("keydown", (ev) => {
      if (ev.target.tagName === "SELECT" || ev.target.tagName === "INPUT") ev.target.blur();
      if (ev.code === "Space") { ev.preventDefault(); player.toggle(); }
      else if (ev.key === "ArrowLeft" && ev.shiftKey) player.seek(player.t - 100);
      else if (ev.key === "ArrowRight" && ev.shiftKey) player.seek(player.t + 100);
      else if (ev.key === "ArrowLeft") this.step(-1);
      else if (ev.key === "ArrowRight") this.step(1);
      else if (ev.key === "Home") player.seek(0);
      else if (ev.key === "End") player.seek(player.rt.tl.dur);
    });
  }

  load(tl) {
    this.steps = tl.steps;
    this.slider.max = tl.dur;
    this.slider.value = 0;
    // forward/backward regions
    this.regions.textContent = "";
    let bwdStart = null;
    for (const st of tl.steps) if (st.bwd) { bwdStart = st.t0; break; }
    const mk = (a, b, color, op) => {
      const d = document.createElement("div");
      d.className = "region";
      d.style.left = `${(a / tl.dur) * 100}%`;
      d.style.width = `${((b - a) / tl.dur) * 100}%`;
      d.style.background = color;
      d.style.opacity = op;
      this.regions.appendChild(d);
    };
    if (bwdStart !== null) {
      mk(0, bwdStart, "var(--act)", 0.3);
      mk(bwdStart, tl.dur, "var(--grad)", 0.35);
    } else mk(0, tl.dur, "var(--act)", 0.3);
    // phase ticks
    this.ticks.textContent = "";
    for (const [, t0] of tl.sections.map((s) => [s[0], s[1]])) {
      if (t0 <= 0) continue;
      const d = document.createElement("div");
      d.className = "tick";
      d.style.left = `${(t0 / tl.dur) * 100}%`;
      this.ticks.appendChild(d);
    }
  }

  step(dir) {
    const t = this.player.t;
    const ts = this.steps;
    if (!ts.length) return;
    let target;
    if (dir > 0) target = ts.find((s) => s.t0 > t + 1);
    else {
      const past = ts.filter((s) => s.t0 < t - 5);
      target = past[past.length - 1];
    }
    this.player.pause();
    this.player.seek(target ? target.t0 + 1 : dir > 0 ? this.player.rt.tl.dur : 0);
  }

  preview(ev) {
    const r = this.slider.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    const t = frac * +this.slider.max;
    let label = "";
    for (const st of this.steps) if (st.t0 <= t) label = `${st.bwd ? "◀ " : ""}L${st.layer} · ${st.phase} · ${st.kind}`;
    if (!label) { this.scrubLabel.hidden = true; return; }
    this.scrubLabel.textContent = label;
    this.scrubLabel.style.left = `${frac * 100}%`;
    this.scrubLabel.hidden = false;
  }

  tick(t) {
    this.slider.value = t;
    this.clock.textContent = `${fmtClock(t)} / ${fmtClock(+this.slider.max)}`;
    this.playBtn.textContent = this.player.playing ? "❚❚" : "▶";
  }
}

"use strict";
/* Wire everything: tabs, mode toggle, counters, URL state, QA still mode. */

(function main() {
  installGlyphs();

  const sceneEl = document.getElementById("scene");
  const stageEl = document.getElementById("stage");
  const player = new Player(sceneEl);
  const program = new Program(document.getElementById("program-list"), (t) => {
    player.pause();
    player.seek(t);
  });
  const transport = new Transport(player);
  initTooltip(stageEl, document.getElementById("canvas"));

  const strategies = ["dp", "fsdp", "tp", "cp", "pp", "ep"];
  const tabsEl = document.getElementById("tabs");
  const modeEl = document.getElementById("mode-toggle");
  const chipColl = document.querySelector("#chip-coll b");
  const chipMM = document.querySelector("#chip-mm b");
  const meshEl = document.getElementById("mesh-eq");
  const state = { s: "tp", m: "train" };

  function available(s, m) {
    return DOC.timelines[`${s}_${m}`] !== undefined;
  }

  for (const s of strategies) {
    const b = document.createElement("button");
    b.textContent = s.toUpperCase();
    b.dataset.s = s;
    b.disabled = !available(s, "fwd") && !available(s, "train");
    if (b.disabled) b.title = "coming soon";
    b.addEventListener("click", () => setState(s, state.m));
    tabsEl.appendChild(b);
  }
  modeEl.querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => setState(state.s, b.dataset.mode))
  );

  function setState(s, m) {
    if (!available(s, m)) m = available(s, "train") ? "train" : "fwd";
    if (!available(s, m)) return;
    state.s = s;
    state.m = m;
    tabsEl.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.s === s));
    modeEl.querySelectorAll("button").forEach((b) => {
      b.classList.toggle("active", b.dataset.mode === m);
      b.disabled = !available(s, b.dataset.mode);
    });
    const rt = buildTimeline(`${s}_${m}`);
    player.pause();
    player.load(rt);
    program.build(rt.tl);
    transport.load(rt.tl);
    const meta = DOC.meta.strategies[s];
    meshEl.textContent = "";
    if (meta) meshEl.appendChild(eqSvg(meta.mesh, 15));
    document.getElementById("program-sub").textContent = m === "train" ? "forward + backward" : "forward";
    writeHash();
  }

  player.onTick = (t) => {
    if (!player.rt) return;
    transport.tick(t);
    program.update(t);
    const cs = player.rt.tl.counters;
    let coll = 0, mm = 0;
    for (const [tc, c, m] of cs) { if (tc <= t) { coll = c; mm = m; } else break; }
    chipColl.textContent = coll;
    chipMM.textContent = mm;
  };

  // legend
  const legend = document.getElementById("legend");
  document.getElementById("legend-btn").addEventListener("click", () => {
    legend.hidden = !legend.hidden;
  });

  // URL state + QA still mode
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    return {
      s: p.get("s") || "tp",
      m: p.get("m") || "train",
      t: p.get("t") ? Math.round(parseFloat(p.get("t")) * 100) : 0,
      still: p.get("still") === "1",
      autoplay: p.get("play") === "1",
    };
  }
  function writeHash() {
    const t = (player.t / 100).toFixed(1);
    history.replaceState(null, "", `#s=${state.s}&m=${state.m}&t=${t}`);
  }
  let hashTimer = null;
  const origPause = player.pause.bind(player);
  player.pause = () => { origPause(); clearTimeout(hashTimer); hashTimer = setTimeout(writeHash, 150); };

  const h = readHash();
  setState(h.s, h.m);
  if (h.t) player.seek(h.t);
  if (h.autoplay) player.play();
  if (h.still) {
    document.fonts.ready.then(() => {
      player.pause();
      document.title = "ready";
    });
  } else if (!h.t && !h.autoplay) {
    // gentle default: start playing after fonts settle
    document.fonts.ready.then(() => setTimeout(() => player.play(), 400));
  }

  // keyboard: strategy/mode switching
  document.addEventListener("keydown", (ev) => {
    const i = "123456".indexOf(ev.key);
    if (i >= 0 && !tabsEl.children[i].disabled) setState(strategies[i], state.m);
    else if (ev.key === "f") setState(state.s, "fwd");
    else if (ev.key === "t") setState(state.s, "train");
  });
})();
</script>
</body>
