<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributed Transformer Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--CSS-->
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">
      <span class="brand-mark">⊞</span>
      <span class="brand-name">Distributed Transformer Training</span>
    </div>
    <nav id="tabs" aria-label="strategy"></nav>
    <div id="mode-toggle" role="tablist" aria-label="pass">
      <button data-mode="fwd" role="tab">Forward</button>
      <button data-mode="train" role="tab">Training</button>
    </div>
    <div id="status">
      <span id="mesh-eq" class="eq-inline"></span>
      <span class="chip" id="chip-coll" title="collectives so far"><i>⇄</i><b>0</b></span>
      <span class="chip" id="chip-mm" title="matmuls so far"><i>×</i><b>0</b></span>
      <button id="legend-btn" title="legend">?</button>
    </div>
  </header>

  <aside id="program">
    <div id="program-head">
      <span>Program</span>
      <span id="program-sub"></span>
    </div>
    <div id="program-list"></div>
  </aside>

  <main id="stage">
    <svg id="canvas" viewBox="0 110 1422 690" preserveAspectRatio="xMidYMid meet">
      <defs id="glyph-defs"></defs>
      <rect id="canvas-bg" x="0" y="110" width="1422" height="690"></rect>
      <g id="scene"></g>
    </svg>
    <div id="tooltip" hidden></div>
    <div id="legend" hidden>
      <div class="lg-row"><span class="sw" style="background:var(--act)"></span> activations</div>
      <div class="lg-row"><span class="sw" style="background:var(--wt)"></span> weights</div>
      <div class="lg-row"><span class="sw" style="background:var(--kv)"></span> K / V</div>
      <div class="lg-row"><span class="sw" style="background:var(--grad)"></span> gradients</div>
      <div class="lg-row"><span class="sw sw-dash"></span> ghost = full logical extent · dashed fill = unreduced partial</div>
      <div class="lg-row"><span class="sw sw-dim"></span> dimmed mini = saved activation (memory for backward)</div>
    </div>
  </main>

  <footer id="transport">
    <button id="btn-prev" title="previous step (←)">⏮</button>
    <button id="btn-play" title="play / pause (space)">▶</button>
    <button id="btn-next" title="next step (→)">⏭</button>
    <select id="speed" title="speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
    <span id="clock">0:00 / 0:00</span>
    <div id="slider-wrap">
      <div id="slider-regions"></div>
      <div id="slider-ticks"></div>
      <input id="slider" type="range" min="0" max="1000" value="0" step="1">
      <div id="scrub-label" hidden></div>
    </div>
  </footer>
</div>
<!--DATA-->
<!--JS-->
</body>
</html>
